<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peak Hours Settings</title>
  <script src="https://extensions.tableauusercontent.com/resources/tableau.extensions.1.latest.min.js"></script>
  <style>
    :root { --ink:#1f2a37; --muted:#5b6675; --line:#d5dbe3; --brand:#1f6feb; --err:#c62828; }
    * { box-sizing:border-box; }
    body { margin:0; padding:16px 20px; font-family:"Segoe UI", Arial, sans-serif; font-size:13px; color:var(--ink); background:#fff; }
    h1 { margin:0 0 4px; font-size:17px; }
    .hint { color:var(--muted); margin:0 0 14px; }
    fieldset { border:1px solid var(--line); border-radius:6px; padding:10px 12px 12px; margin:0 0 12px; }
    legend { font-weight:600; padding:0 4px; }
    label { display:inline-flex; align-items:center; gap:4px; }
    select, input[type=time], input[type=number] { padding:5px 7px; border:1px solid var(--line); border-radius:4px; font:inherit; }
    select { width:100%; }
    .win { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
    .days { display:flex; flex-wrap:wrap; gap:10px; }
    button { padding:6px 14px; border:0; border-radius:4px; font:inherit; font-weight:600; cursor:pointer; }
    .primary { background:var(--brand); color:#fff; }
    .ghost { background:#eef2f7; color:var(--ink); }
    .remove { background:none; color:var(--err); padding:4px 8px; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    #err { color:var(--err); min-height:1.2em; margin:4px 0 8px; }
    .actions { display:flex; justify-content:flex-end; gap:8px; }
  </style>
</head>
<body>
  <h1>Peak Hours Download – Settings</h1>
  <p class="hint">Downloads are blocked during the times below. These settings are saved in this workbook.</p>

  <fieldset>
    <legend>Time zone</legend>
    <select id="tz" aria-label="Time zone"></select>
  </fieldset>

  <fieldset>
    <legend>Peak hours (downloads blocked)</legend>
    <div id="windows"></div>
    <button type="button" class="ghost" id="addWin">+ Add time window</button>
  </fieldset>

  <fieldset>
    <legend>Days peak hours apply</legend>
    <div class="days" id="days"></div>
  </fieldset>

  <fieldset>
    <legend>Row limit outside peak hours</legend>
    <label><input type="number" id="maxRows" min="0" step="1" style="width:110px"> rows &nbsp;<span class="hint" style="margin:0">(0 = no limit)</span></label>
  </fieldset>

  <div id="err" role="alert"></div>
  <div class="actions">
    <button type="button" class="ghost" id="cancel">Cancel</button>
    <button type="button" class="primary" id="save">Save</button>
  </div>

<script>
  const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const DEFAULTS = { timeZone:"Asia/Kolkata", windows:[{start:"10:00", end:"18:00"}], days:[1,2,3,4,5], maxRows:100 };

  const winBox = document.getElementById("windows");
  const errEl = document.getElementById("err");

  function fillTimeZones(selected) {
    let zones = [];
    try { zones = Intl.supportedValuesOf("timeZone"); } catch (e) {}
    if (!zones.length) zones = ["Asia/Kolkata","UTC","Europe/London","America/New_York","America/Chicago","America/Los_Angeles","Asia/Dubai","Asia/Singapore","Australia/Sydney"];
    if (!zones.includes(selected)) zones.unshift(selected);
    const sel = document.getElementById("tz");
    zones.forEach(z => { const o = document.createElement("option"); o.value = o.textContent = z; sel.appendChild(o); });
    sel.value = selected;
  }

  function addWindow(w) {
    const row = document.createElement("div");
    row.className = "win";
    row.innerHTML = `<label>From <input type="time" class="s" required></label>
                     <label>To <input type="time" class="e" required></label>
                     <button type="button" class="remove" aria-label="Remove this window">Remove</button>`;
    row.querySelector(".s").value = w.start;
    row.querySelector(".e").value = w.end;
    row.querySelector(".remove").onclick = () => row.remove();
    winBox.appendChild(row);
  }

  function fillDays(selected) {
    const box = document.getElementById("days");
    DAY_NAMES.forEach((n, i) => {
      const l = document.createElement("label");
      l.innerHTML = `<input type="checkbox" value="${i}"> ${n}`;
      l.querySelector("input").checked = selected.includes(i);
      box.appendChild(l);
    });
  }

  tableau.extensions.initializeDialogAsync().then(payload => {
    let cfg = DEFAULTS;
    try { const p = JSON.parse(payload); if (p && p.windows) cfg = p; } catch (e) {}
    fillTimeZones(cfg.timeZone);
    cfg.windows.forEach(addWindow);
    fillDays(cfg.days);
    document.getElementById("maxRows").value = cfg.maxRows;
  });

  document.getElementById("addWin").onclick = () => addWindow({ start:"", end:"" });
  document.getElementById("cancel").onclick = () => tableau.extensions.ui.closeDialog("cancel");

  document.getElementById("save").onclick = async () => {
    errEl.textContent = "";
    const windows = [...winBox.querySelectorAll(".win")].map(r => ({
      start: r.querySelector(".s").value, end: r.querySelector(".e").value }));
    if (!windows.length) return errEl.textContent = "Add at least one time window.";
    if (windows.some(w => !w.start || !w.end)) return errEl.textContent = "Fill in both times for every window.";
    if (windows.some(w => w.start === w.end)) return errEl.textContent = "Start and end time can't be the same.";
    const days = [...document.querySelectorAll("#days input:checked")].map(c => Number(c.value));
    if (!days.length) return errEl.textContent = "Select at least one day.";
    const maxRows = Math.max(0, parseInt(document.getElementById("maxRows").value, 10) || 0);
    const cfg = { timeZone: document.getElementById("tz").value, windows, days, maxRows };

    try {
      tableau.extensions.settings.set("peakConfig", JSON.stringify(cfg));
      await tableau.extensions.settings.saveAsync();
      tableau.extensions.ui.closeDialog("saved");
    } catch (e) {
      errEl.textContent = "Could not save settings: " + (e && e.message ? e.message : e);
    }
  };
</script>
</body>
</html>
