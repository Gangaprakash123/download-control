<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Control</title>
  <!-- Official Tableau Extensions API library -->
  <script src="https://extensions.tableauusercontent.com/resources/tableau.extensions.1.latest.min.js"></script>
  <style>
    :root { --ink:#1f2a37; --muted:#5b6675; --line:#d5dbe3; --brand:#1f6feb; --ok:#1a7f37; --err:#c62828; --warn:#b26a00; }
    * { box-sizing: border-box; }
    body { margin:0; padding:10px; font-family: "Segoe UI", Arial, sans-serif; font-size:13px; color:var(--ink); background:#fff; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .sheet { flex:1; min-width:140px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#f6f8fa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sheet.waiting { color:var(--muted); font-style:italic; }
    button { padding:7px 14px; border:0; border-radius:4px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    #rules { margin-top:6px; font-size:12px; color:var(--muted); }
    #rules.on { color:var(--warn); font-weight:600; }
    #status { margin-top:4px; color:var(--muted); min-height:1.2em; }
    #status.ok { color:var(--ok); } #status.err { color:var(--err); }
    .overlay { position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; padding:10px; }
    .overlay[hidden] { display:none; }
    .box { background:#fff; border-top:4px solid var(--err); border-radius:6px; padding:14px 16px; max-width:380px; width:100%; box-shadow:0 8px 24px rgba(0,0,0,.25); }
    .box h2 { margin:0 0 6px; font-size:15px; color:var(--err); }
    .box p { margin:0 0 12px; line-height:1.45; }
  </style>
</head>
<body>
  <div class="row">
    <div id="sheet" class="sheet" aria-live="polite">Loading…</div>
    <button id="dl" disabled>Download data</button>
  </div>
  <div id="rules"></div>
  <div id="status"></div>

  <!-- Fallback popup (used only if Tableau's popup window is not available) -->
  <div id="popup" class="overlay" hidden>
    <div class="box" role="alertdialog" aria-labelledby="popupTitle" aria-describedby="popupMsg">
      <h2 id="popupTitle"></h2>
      <p id="popupMsg"></p>
      <button id="popupOk">OK</button>
    </div>
  </div>

<script>
  // Nothing is hard-coded here. The developer chooses the rules in Tableau
  // (first time automatically, later via the extension menu > Configure).
  // They are saved in the workbook under "downloadControl":
  //   { mode: "rows" | "time" | "both", maxRows, timeZone, windows:[{start,end}], days:[0-6] }

  const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const sheetLabel = document.getElementById("sheet");
  const btn = document.getElementById("dl");
  const statusEl = document.getElementById("status");
  const rulesEl = document.getElementById("rules");

  let cfg = null;             // saved settings, or null if not configured
  let selectedSheet = null;   // the worksheet the user last clicked

  const useRows = () => cfg && (cfg.mode === "rows" || cfg.mode === "both");
  const useTime = () => cfg && (cfg.mode === "time" || cfg.mode === "both");

  function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }

  // ----- Settings -----
  function loadSettings() {
    cfg = null;
    const raw = tableau.extensions.settings.get("downloadControl");
    if (!raw) return;
    try { const c = JSON.parse(raw); if (c && c.mode) cfg = c; } catch (e) {}
  }

  async function configure() {
    const url = new URL("config.html", window.location.href).href;
    try {
      await tableau.extensions.ui.displayDialogAsync(url, cfg ? JSON.stringify(cfg) : "", { width: 500, height: 580 });
    } catch (err) {
      if (!(err && err.errorCode === tableau.ErrorCodes.DialogClosedByUser)) {
        setStatus("Could not open settings: " + (err && err.message ? err.message : err), "err");
      }
    }
    loadSettings();
    refreshRules();
  }

  // ----- Peak hours -----
  const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };

  function nowInZone() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: cfg.timeZone || "Asia/Kolkata", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).formatToParts(new Date());
    const get = t => parts.find(p => p.type === t).value;
    return { day: DAY_NAMES.indexOf(get("weekday")), minutes: Number(get("hour")) * 60 + Number(get("minute")) };
  }

  function activePeakWindow() {
    if (!useTime()) return null;
    const { day, minutes } = nowInZone();
    if (!cfg.days.includes(day)) return null;
    return cfg.windows.find(w => {
      const s = toMin(w.start), e = toMin(w.end);
      return s <= e ? (minutes >= s && minutes < e) : (minutes >= s || minutes < e);
    }) || null;
  }

  // ----- Rules line under the button -----
  function refreshRules() {
    if (!cfg) {
      rulesEl.textContent = "Not configured yet. Open the extension menu and choose Configure.";
      rulesEl.className = "on";
      return;
    }
    const parts = [];
    if (useRows()) parts.push(`Max ${cfg.maxRows} rows per download.`);
    if (useTime()) {
      const w = activePeakWindow();
      if (w) {
        rulesEl.textContent = `Peak hours now (${w.start}–${w.end}). Downloads are blocked until ${w.end}.`;
        rulesEl.className = "on";
        return;
      }
      const list = cfg.windows.map(x => `${x.start}–${x.end}`).join(", ");
      const days = cfg.days.map(d => DAY_NAMES[d]).join(", ");
      parts.push(`Blocked during peak hours: ${list} (${days}, ${cfg.timeZone}).`);
    }
    rulesEl.textContent = parts.join(" ");
    rulesEl.className = "";
  }
  setInterval(() => { if (cfg) refreshRules(); }, 30000);

  // ----- Sheet detection -----
  function selectSheet(ws) {
    selectedSheet = ws;
    sheetLabel.textContent = "Sheet: " + ws.name;
    sheetLabel.title = ws.name;
    sheetLabel.classList.remove("waiting");
    btn.disabled = false;
  }

  tableau.extensions.initializeAsync({ configure }).then(() => {
    loadSettings();
    refreshRules();

    tableau.extensions.settings.addEventListener(tableau.TableauEventType.SettingsChanged, () => {
      loadSettings(); refreshRules();
    });

    // First time a developer adds the extension: open the setup automatically
    if (!cfg && tableau.extensions.environment.mode === "authoring") configure();

    const sheets = tableau.extensions.dashboardContent.dashboard.worksheets;
    if (!sheets.length) {
      sheetLabel.textContent = "No sheets on this dashboard";
      sheetLabel.classList.add("waiting");
      return;
    }
    if (sheets.length === 1) {
      selectSheet(sheets[0]);
    } else {
      sheetLabel.textContent = "Click any sheet on the dashboard";
      sheetLabel.classList.add("waiting");
    }
    sheets.forEach(ws => {
      ws.addEventListener(tableau.TableauEventType.MarkSelectionChanged, () => { selectSheet(ws); setStatus(""); });
      ws.addEventListener(tableau.TableauEventType.FilterChanged, () => { selectSheet(ws); setStatus(""); });
    });
  }).catch(err => setStatus("Extension failed to start: " + (err && err.message ? err.message : err), "err"));

  // ----- Download button -----
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      const ws = selectedSheet;
      if (!ws) { setStatus("Click a sheet on the dashboard first.", "err"); return; }
      if (!cfg) { setStatus("Extension not configured. Please contact your admin.", "err"); return; }

      // 1) Peak hours
      const w = activePeakWindow();
      if (w) {
        setStatus(`Download blocked: peak hours (${w.start}–${w.end}).`, "err");
        await showPopup("Download not allowed",
          [`Downloads are not allowed during peak hours (${w.start}–${w.end}).`,
           `Please try again after ${w.end}, or contact your admin.`]);
        return;
      }

      // 2) Row limit
      setStatus("Preparing file…");
      const limit = useRows() ? cfg.maxRows + 1 : 0;
      const table = await getData(ws, limit);
      const total = table.totalRowCount || table.data.length;

      if (useRows() && total > cfg.maxRows) {
        const countText = table.totalRowCount ? table.totalRowCount : "more than " + cfg.maxRows;
        setStatus(`Download blocked: ${countText} rows selected.`, "err");
        await showPopup("Download not allowed",
          [`You are requesting more than ${cfg.maxRows} records. Unable to download.`,
           "Please contact your admin.",
           table.totalRowCount ? `Your current filter returns ${table.totalRowCount} records. Apply more filters to bring it to ${cfg.maxRows} or fewer.` : ""]);
        return;
      }

      saveFile(toCsv(table.columns, table.data), `${safe(ws.name)}.csv`);
      setStatus(`Downloaded ${table.data.length} rows.`, "ok");
    } catch (err) {
      setStatus("Download failed: " + (err && err.message ? err.message : err), "err");
    } finally {
      btn.disabled = false;
    }
  });

  // ----- Popup -----
  async function showPopup(title, lines) {
    lines = lines.filter(Boolean);
    const url = new URL("dialog.html", window.location.href).href;
    try {
      await tableau.extensions.ui.displayDialogAsync(url, JSON.stringify({ title, lines }), { width: 420, height: 240 });
    } catch (err) {
      if (err && err.errorCode === tableau.ErrorCodes.DialogClosedByUser) return;
      document.getElementById("popupTitle").textContent = title;
      document.getElementById("popupMsg").textContent = lines.join(" ");
      document.getElementById("popup").hidden = false;
      document.getElementById("popupOk").focus();
    }
  }
  document.getElementById("popupOk").addEventListener("click", () => {
    document.getElementById("popup").hidden = true;
  });

  // ----- Data helpers -----
  async function getData(ws, limit) {
    if (ws.getSummaryDataReaderAsync) {
      const reader = await ws.getSummaryDataReaderAsync(limit || undefined, { ignoreSelection: true });
      try {
        if (limit) {
          const page = await reader.getPageAsync(0);
          return { columns: page.columns, data: page.data, totalRowCount: reader.totalRowCount };
        }
        const t = await reader.getAllPagesAsync();
        return { columns: t.columns, data: t.data, totalRowCount: reader.totalRowCount };
      } finally {
        await reader.releaseAsync();
      }
    }
    const opts = { ignoreSelection: true };
    if (limit) opts.maxRows = limit;
    const t = await ws.getSummaryDataAsync(opts);
    return { columns: t.columns, data: t.data, totalRowCount: null };
  }

  function toCsv(columns, rows) {
    const esc = v => {
      const s = v == null ? "" : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const header = columns.map(c => esc(c.fieldName)).join(",");
    const body = rows.map(r => r.map(cell => esc(cell.formattedValue)).join(","));
    return "﻿" + [header, ...body].join("\r\n");
  }

  function saveFile(text, name) {
    const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const safe = s => s.replace(/[\\/:*?"<>|]+/g, "_").trim() || "data";
</script>
</body>
</html>
